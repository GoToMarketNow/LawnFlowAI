version: '3.8'

services:
  temporal:
    image: temporalio/auto-setup:1.22
    container_name: lawnflow-temporal
    ports:
      - "7233:7233"  # gRPC frontend
    environment:
      - DB=postgresql
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=temporal-db
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
    depends_on:
      temporal-db:
        condition: service_healthy
    networks:
      - temporal-network

  temporal-db:
    image: postgres:15
    container_name: lawnflow-temporal-db
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    volumes:
      - temporal-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - temporal-network

  temporal-ui:
    image: temporalio/ui:2.21
    container_name: lawnflow-temporal-ui
    ports:
      - "8080:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000,http://localhost:5000
    depends_on:
      - temporal
    networks:
      - temporal-network

  temporal-admin-tools:
    image: temporalio/admin-tools:1.22
    container_name: lawnflow-temporal-admin
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    depends_on:
      - temporal
    networks:
      - temporal-network
    stdin_open: true
    tty: true

volumes:
  temporal-db-data:
    name: lawnflow-temporal-db-data

networks:
  temporal-network:
    name: lawnflow-temporal-network
    driver: bridge
